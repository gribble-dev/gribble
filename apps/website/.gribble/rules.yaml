# Rule severities for gribble.dev.
# Reference: https://gribble.dev/docs/configuration/rules-yaml
# yaml-language-server: $schema=https://gribble.dev/schema/rules.json

extends:
  - gribble:recommended

rules:
  # Pixel comparison is off in the preset; this site is small enough to afford it.
  visual/regression: [warn, { threshold: 0.01, viewports: [mobile, desktop] }]
