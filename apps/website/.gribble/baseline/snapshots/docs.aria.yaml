    - heading "Overview" [level=2]
    - list:
      - listitem:
        - link "Getting started":
          - /url: /docs/getting-started
        - text: Install Gribble, run init, and get your first audit and baseline.
      - listitem:
        - link "Flows":
          - /url: /docs/flows
        - text: Describe user journeys in Markdown; let the gribbles walk them.
      - listitem:
        - link "Guidelines":
          - /url: /docs/guidelines
        - text: House rules a model has to judge — written in prose, appended to Gribble's system prompt.
      - listitem:
        - link "Auth":
          - /url: /docs/auth
        - text: Logging in to the site under test, and logging in to your model provider. Two different problems.
      - listitem:
        - link "CI and the GitHub Action":
          - /url: /docs/ci-github-action
        - text: Run Gribble on every pull request, comment findings, upload SARIF, and keep the baseline fresh.
      - listitem:
        - link "Monorepos":
          - /url: /docs/monorepos
        - text: One .gribble/ per app, with rules and guidelines cascading up to the repository root.
      - listitem:
        - link "Skills for coding agents":
          - /url: /docs/skills
        - text: Teach Claude Code, pi or Cursor to read Gribble's report, fix what it found, and keep your rules and flows current.
      - listitem:
        - link "CLI reference":
          - /url: /docs/cli
        - text: Every command, every flag, exit codes, and the --ci output contract.
      - listitem:
        - link "Report format":
          - /url: /docs/report-format
        - text: The report JSON, its versioning guarantees, and the SARIF and JUnit outputs derived from it.
      - listitem:
        - link "FAQ":
          - /url: /docs/faq
        - text: Cost, non-determinism, false positives, privacy, Windows, mobile, and why not just use Lighthouse CI.
      - listitem:
        - link "README":
          - /url: /docs/README
    - heading "Concepts" [level=2]
    - list:
      - listitem:
        - link "Gate and review":
          - /url: /docs/concepts/gate-and-review
        - text: Two modes with different contracts — one is deterministic and can block a merge, the other is an AI agent that only ever comments.
      - listitem:
        - link "Baseline":
          - /url: /docs/concepts/baseline
        - text: The committed snapshot of your main branch's known state — everything Gribble reports is a diff against it.
      - listitem:
        - link "Findings":
          - /url: /docs/concepts/findings
        - text: What a finding contains, how its fingerprint is computed, how severity works, and how comments live and die.
    - heading "Configuration" [level=2]
    - list:
      - listitem:
        - link "gribble.yaml":
          - /url: /docs/configuration/gribble-yaml
        - text: Project settings — target URL, model, budgets, origins, environments, auth profiles, baseline and output.
      - listitem:
        - link "rules.yaml":
          - /url: /docs/configuration/rules-yaml
        - text: ESLint-style rule configuration — extends, ignore, severities, options and per-route overrides.
      - listitem:
        - link "Rules reference":
          - /url: /docs/configuration/rules-reference
        - text: Every rule Gribble knows, with options, preset defaults and fix hints.
