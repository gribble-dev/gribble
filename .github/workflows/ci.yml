name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The "chore: release" PR only bumps versions and CHANGELOGs; its code already passed CI on the
# PRs that carried it. Skipping it also avoids the "workflow awaiting approval" prompt GitHub shows
# for PRs opened by github-actions[bot].
jobs:
  test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }})
    if: github.head_ref != 'changeset-release/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
        include:
          # Oldest supported runtime (engines.node >= 22).
          - os: ubuntu-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm --filter @gribble/core exec playwright install --with-deps chromium
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm --filter @gribble/core exec playwright install chromium
        if: matrix.os == 'windows-latest'
      - run: pnpm test

  website:
    name: Website build
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @gribble/website build
