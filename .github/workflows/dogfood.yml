# Dogfooding: Gribble audits its own website on every PR.
#
# External users write `uses: gribble-dev/action@v1`, which resolves to the mirror repository
# filled by mirror-action.yml. The monorepo runs `./packages/action` instead so a PR that changes
# the action is tested with its own build (dist/ is produced by the `pnpm build` step below).
name: Gribble (website)

on:
  pull_request:
    paths:
      - "apps/website/**"
      - "docs/**"
      - "packages/**"

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  audit:
    # Not for the "chore: release" PR: it only bumps versions and CHANGELOGs (see ci.yml).
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @gribble/website build
      - run: pnpm --filter @gribble/core exec playwright install --with-deps chromium
      - name: Audit the website
        uses: ./packages/action
        with:
          working-directory: apps/website
          mode: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
