name: Docker image

on:
  push:
    # changesets tags releases as <package>@<version>; the CLI package's tag drives the image.
    tags: ["gribble@*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read the released version
        id: version
        run: echo "version=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/gribble-dev/gribble:latest
            ghcr.io/gribble-dev/gribble:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/gribble-dev/gribble
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
