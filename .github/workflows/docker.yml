name: Docker image

on:
  push:
    # changesets tags releases as <package>@<version>; the CLI package's tag drives the image.
    tags: ["gribble@*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/gribble-dev/gribble:latest
            ghcr.io/gribble-dev/gribble:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/gribble-dev/gribble
