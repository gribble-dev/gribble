packages:
  - packages/*
  - apps/*

# Every pi package is pinned to the same exact version (pi moves fast; OpenClaw does the same).
# Bump all three together.
catalog:
  "@earendil-works/pi-coding-agent": 0.85.1
  "@earendil-works/pi-ai": 0.85.1
  "@earendil-works/pi-agent-core": 0.85.1
  typebox: 1.3.7
  typescript: 5.9.3
  tsdown: 0.23.0
  vitest: 5.0.0
  "@types/node": 22.20.2
  "@changesets/cli": 3.0.2
  playwright: 1.63.0
  yaml: 2.9.0
  picocolors: 1.1.1

allowBuilds:
  "@biomejs/biome": true
  esbuild: true
  sharp: true
  playwright: true
  "@silvia-odwyer/photon-node": true
  workerd: true
  protobufjs: false
  "@google/genai": false

minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20260911.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260911.1'
  - '@cloudflare/workerd-linux-64@1.20260911.1'
  - '@cloudflare/workerd-linux-arm64@1.20260911.1'
  - '@cloudflare/workerd-windows-64@1.20260911.1'
  - miniflare@5.20260911.0-alpha
  - workerd@1.20260911.1
  - wrangler@4.131.1
