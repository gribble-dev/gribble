<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Forms – Fixture Harbor</title>
	<meta name="description" content="POST forms with and without CSRF tokens, plus forms the rule must leave alone.">
	<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
	<nav aria-label="Main"><a href="/">Home</a></nav>
	<main>
		<h1>Forms</h1>
		<form method="post" action="/comments" id="unprotected" aria-label="Comment">
			<label for="comment">Comment</label>
			<textarea id="comment" name="comment"></textarea>
			<button type="submit">Post comment</button>
		</form>
		<form method="post" action="/subscribe" id="protected" aria-label="Subscribe">
			<input type="hidden" name="authenticity_token" value="abc123">
			<label for="email">Email</label>
			<input id="email" name="email" type="email">
			<button type="submit">Subscribe</button>
		</form>
		<form method="post" action="https://checkout.example.com/pay" id="external" aria-label="Pay">
			<button type="submit">Pay elsewhere</button>
		</form>
		<form method="get" action="/search" id="search" role="search">
			<label for="q">Search</label>
			<input id="q" name="q" type="search">
			<button type="submit">Search</button>
		</form>
	</main>
</body>
</html>
