<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Overlapping buttons – Fixture Harbor</title>
	<meta name="description" content="Two buttons positioned on top of each other, so the overlap check has something to report.">
</head>
<body>
	<main>
		<h1>Overlap</h1>
		<div style="position: relative; height: 120px;">
			<button type="button" data-testid="first" style="position: absolute; left: 20px; top: 20px; width: 120px; height: 44px;">First</button>
			<button type="button" data-testid="second" style="position: absolute; left: 60px; top: 30px; width: 120px; height: 44px;">Second</button>
		</div>
	</main>
</body>
</html>
