<html lang="en">
<head>

	<nav aria-label="Main"><a href="/">Home</a></nav>
	<main>
		<h1>Odd gaps</h1>

		<div class="off" data-testid="off">Off the scale</div>
		<div class="on" data-testid="on">On the scale</div>
	</main>
</body>
